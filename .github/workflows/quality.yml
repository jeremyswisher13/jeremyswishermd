name: Website quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Source validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run source validators
        run: npm run validate

      - name: Verify the public Pages artifact can be packaged
        run: npm run build:pages

  referral-pdf:
    name: Referral PDF structure and regeneration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF authoring dependencies
        run: python -m pip install --disable-pip-version-check reportlab==4.4.9 pypdf==6.10.0

      - name: Validate the published PDF structure
        run: python -B scripts/validate_tagged_pdf.py resources/jeremy-swisher-referral-guide.pdf

      - name: Regenerate and validate the referral PDF
        run: python -B scripts/generate-referral-guide.py

  rendered:
    name: Rendered accessibility and behavior
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run rendered checks
        run: npm run test:rendered

      - name: Set up Python for printed-handout checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF reader
        run: python -m pip install --disable-pip-version-check pypdf==6.10.0

      - name: Check actual Letter and A4 exercise PDFs
        run: npm run test:print-pdf

      - name: Upload printable-handout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exercise-print-results
          path: .quality-results/print/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload rendered-test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  webkit:
    name: Mobile WebKit smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - name: Check mobile navigation, search, progress storage, and sharing
        run: npm run test:webkit

      - name: Upload WebKit failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-results
          path: .quality-results/webkit/
          if-no-files-found: ignore
          retention-days: 7

  visual-text:
    name: Rendered text clipping and visual evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Audit visible text at narrow mobile, mobile, tablet, and desktop widths
        run: npx playwright test --config=playwright.visual-text.config.mjs

      - name: Upload text geometry reports and visual review captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-text-results
          path: .quality-results/visual-text/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy validated website
    # All checks must succeed for this exact workflow commit. Pull requests and
    # dispatches on other branches can run checks but cannot publish anything.
    needs: [validate, referral-pdf, rendered, webkit, visual-text, lighthouse]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-deployment
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the exact validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package only public website files
        run: npm run build:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload this commit's public website
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.sha }}
          path: .quality-results/pages

      - name: Refuse an outdated main commit
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current_sha" != "$EXPECTED_SHA" ]; then
            echo 'Main has changed since these checks began. The newer commit must pass its own checks.'
            exit 1
          fi

      - name: Deploy the validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.sha }}

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Lighthouse budgets
        run: npm run test:lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .quality-results/lighthouse/
          if-no-files-found: ignore
          retention-days: 14
