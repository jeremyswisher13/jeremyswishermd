name: Website quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Source validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run source validators
        run: npm run validate

  rendered:
    name: Rendered accessibility and behavior
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run rendered checks
        run: npm run test:rendered

      - name: Upload rendered-test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Lighthouse budgets
        run: npm run test:lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .quality-results/lighthouse/
          if-no-files-found: ignore
          retention-days: 14
